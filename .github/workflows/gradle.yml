name: Build and Release

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - '**' # Matches any tag pushed

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Grant execute permission for gradlew
        if: runner.os == 'Linux'
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew test packageBinary

      - name: Package Windows Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path build/native/vanitygen -DestinationPath vanitygen-windows-x64.zip

      - name: Package Linux Binary
        if: matrix.os == 'ubuntu-latest'
        run: tar -czvf vanitygen-linux-x64.tar.gz -C build/native vanitygen

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            vanitygen-windows-x64.zip
            vanitygen-linux-x64.tar.gz
            build/libs/*.jar
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
